name: swing-engine

# Two scheduled runs per week (times in UTC; IST = UTC+5:30).
# Saturday 08:00 IST = 02:30 UTC Sat | Monday 07:00 IST = 01:30 UTC Mon
on:
  schedule:
    - cron: "30 2 * * 6"   # Saturday full recompute
    - cron: "30 1 * * 1"   # Monday delta check
  workflow_dispatch:        # allow manual runs from the Actions tab
    inputs:
      mode:
        description: "saturday or monday"
        required: true
        default: "saturday"

concurrency:
  group: swing-engine        # never let two runs overlap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # allow the bot to commit state back
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "6" ]; then
            echo "mode=saturday" >> "$GITHUB_OUTPUT"
          else
            echo "mode=monday" >> "$GITHUB_OUTPUT"
          fi

      - name: Run engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATE_REPO_DIR: ${{ github.workspace }}
        run: |
          git config user.name "swing-engine"
          git config user.email "bot@users.noreply.github.com"
          python -m swing_engine.app.main "${{ steps.mode.outputs.mode }}"

      - name: Push state
        if: always()
        run: |
          git add state/ || true
          git diff --cached --quiet || git commit -m "state: automated run ${{ github.run_id }}"
          git push || echo "nothing to push"
